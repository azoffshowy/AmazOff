worker_processes  1;

events {
    worker_connections 1024;
}

http {
    types {
        application/javascript                           js;
        text/plain                                       txt;
    }
    default_type  application/javascript;
    sendfile      on;

    log_format with_body
      '$remote_addr - $remote_user [$time_local] '
      '"$request" $status $body_bytes_sent '
      '"$http_referer" "$http_user_agent" '
      'body="$request_body" '
      'source=$sent_http_x_amazoff_source_sha patch=$sent_http_x_amazoff_patch_sha';

    server {
        listen 127.0.0.1:443 ssl;
        listen [::1]:443 ssl;
        server_name cloudfront.xp-assets.aiv-cdn.net;

        ssl_certificate     /media/developer/apps/usr/palm/applications/com.amazoff.patcher/resources/amazon/tls/server.crt;
        ssl_certificate_key /media/developer/apps/usr/palm/applications/com.amazoff.patcher/resources/amazon/tls/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        access_log /tmp/patcher/logs/access.log with_body;
        root /media/developer/apps/usr/palm/applications/com.amazoff.patcher/resources/amazon/patch;
        include /media/developer/apps/usr/palm/applications/com.amazoff.patcher/resources/amazon/patch/identity.conf;

        add_header Cache-Control no-store;

        # Older webOS 4.x path
        location = /family/lg/ATVUnfPlayerBundle-1.0/onebox1/js/ATVUnfPlayerBundle.js {
            try_files /ATVUnfPlayerBundle.js =404;
        }

        # webOS 6.5
        location = /family/lg/ATVUnfPlayerBundle-1.0/wave1/js/ATVUnfPlayerBundle.js {
            try_files /ATVUnfPlayerBundle.js =404;
        }

        # webOS 9.x
        location = /family/lg/ATVUnfPlayerBundle-1.0/wave2/js/ATVUnfPlayerBundle.js {
            try_files /ATVUnfPlayerBundle.js =404;
        }

        # Future Amazon route variants, kept as exact locations because the
        # TV's bundled nginx build has no PCRE support for a regex location.
        location = /family/lg/ATVUnfPlayerBundle-1.0/wave3/js/ATVUnfPlayerBundle.js {
            try_files /ATVUnfPlayerBundle.js =404;
        }

        location = /family/lg/ATVUnfPlayerBundle-1.0/wave4/js/ATVUnfPlayerBundle.js {
            try_files /ATVUnfPlayerBundle.js =404;
        }

        location = / {
            add_header Content-Type application/x-directory;
            try_files /empty =404;
            add_header Content-Length 0;
        }

        location / {
            try_files /__nonexistent__ =404;
        }
    }
    server {
        listen 127.0.0.1:80 default_server;
        listen [::1]:80 default_server;
        server_name cloudfront.xp-assets.aiv-cdn.net;

        access_log /tmp/patcher/logs/access.log with_body;
        root /media/developer/apps/usr/palm/applications/com.amazoff.patcher/resources/amazon/patch;

        location = / {
            add_header Content-Type application/x-directory;
            try_files /empty =404;
            add_header Content-Length 0;
        }

        location / {
            try_files /__nonexistent__ =404;
        }
    }
}
